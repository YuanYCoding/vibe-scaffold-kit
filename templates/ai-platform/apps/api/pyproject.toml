[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "__PROJECT_SLUG__-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.18,<2",
  "celery[redis]>=5.6,<6",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.139,<0.140",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.14,<3",
  "redis>=8,<9",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.51,<0.52",
]

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
